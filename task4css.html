<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .sidenav {
            height: 100%;
            width: 60px;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: #111;
            overflow-x: hidden;
            padding-top: 20px;
        }

        .sidenav a {
            padding: 10px 0 10px 10px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            display: block;
            transition: 0.3s;
            height: 60px;
            width: 60px;
        }

        .sidenav a:hover {
            width: 200px;
            color: white;
        }

        .green {
            background-color: #4CAF50;
        }

        .blue {
            background-color: #2196F3;
        }

        .red {
            background-color: #f44336;
        }

        .gray {
            background-color: #555;
        }

        .main {
            margin-left: 60px;
            padding: 16px;
        }
    </style>
</head>

<body>

    <div class="sidenav">
        <a href="#" class="green"></a>
        <a href="#" class="blue"></a>
        <a href="#" class="red"></a>
        <a href="#" class="gray"></a>
    </div>

    <div class="main">
        <h2>Hoverable Sidenav Buttons</h2>
        <p>Hover over the buttons in the left side navigation to open them.</p>
    </div>

</body>

</html>
